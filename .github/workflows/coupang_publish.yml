name: Coupang Product Review Publish

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: "상품명 (예: 충남오감 세도농협 GAP 인증 대추방울토마토 1kg)"
        required: true
      price:
        description: "가격 (예: 6,200원)"
        required: true
      coupang_link:
        description: "쿠팡 상품 링크"
        required: true
      volume:
        description: "용량/수량 (예: 1kg, 1박스) — 선택"
        required: false
        default: ""
      features:
        description: "주요 특징/스펙 — 줄바꿈으로 구분해서 입력, 선택"
        required: false
        default: ""
      memo:
        description: "추가 메모 (글에 반영할 정보) — 선택"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-coupang-review:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 쿠팡 리뷰 파이프라인 실행
        env:
          PRODUCT_NAME: ${{ github.event.inputs.product_name }}
          PRICE: ${{ github.event.inputs.price }}
          COUPANG_LINK: ${{ github.event.inputs.coupang_link }}
          VOLUME: ${{ github.event.inputs.volume }}
          FEATURES: ${{ github.event.inputs.features }}
          MEMO: ${{ github.event.inputs.memo }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/main_coupang.py

      - name: 처리 기록 커밋
        run: |
          git config user.name "gov-policy-bot"
          git config user.email "actions@github.com"
          git add data/processed_coupang.json data/recent_images.json
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: update coupang processed/image history [skip ci]"
          git push
